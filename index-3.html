<script>
const W=320,H=180,MW=60,MH=40,WW=MW*16,WH=MH*16;

const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),PK=a=>a[RI(0,a.length-1)],cl=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- DATOS ---------- */
const CH=[
 {n:'Briana',r:'Alcaldesa',c:'#c9b79c',a:'crown',sp:'Decreto Real'},
 {n:'Stacy',r:'Tte. alcaldesa',c:'#ff9a3c',a:'bow',sp:'Lazo Rosa'},
 {n:'Thiago',r:'Reg. educación',c:'#9aa0b0',a:'cap',sp:'Lluvia de útiles'},
 {n:'Sebastián',r:'Reg. derechos',c:'#f2d28b',a:'scale',sp:'Escudo de derechos'},
 {n:'Anyeli',r:'Reg. bienestar',c:'#f5f5f5',a:'heart',sp:'Abrazo curativo'}];
const WC=[
 {nm:'Pistola de burbujas',c:'#6cf',l:5,h:3,cd:18,dm:1.2,sp:3,mag:12,rl:60},
 {nm:'Subfusil de papelitos',c:'#fd3',l:7,h:3,cd:6,dm:.6,sp:3.2,mag:30,rl:90},
 {nm:'Fusil de dardos',c:'#f93',l:11,h:3,cd:10,dm:1,sp:3.4,mag:24,rl:100},
 {nm:'Ametralladora de globos',c:'#9f6',l:11,h:4,cd:5,dm:.7,sp:3,mag:60,rl:170},
 {nm:'Escopeta de confeti',c:'#f6c',l:9,h:3,cd:45,dm:.8,sp:2.6,mag:6,rl:110,n:5,sp2:.25,life:30,rg:70},
 {nm:'Francotirador de tiza',c:'#fff',l:15,h:2,cd:70,dm:6,sp:6,mag:4,rl:130,pc:3,life:90,rg:220},
 {nm:'Bazuca de pelotas',c:'#f55',l:12,h:5,cd:80,dm:25,sp:2.2,mag:1,rl:150,ex:48,one:1}];

const UP=[['d','DAÑO +10%'],['s','VELOCIDAD +5%'],['h','VIDA +1'],['c','CARGA +15%'],['r','CADENCIA +8%']];
const EN={mugre:{c:'#6a4',hp:2,sp:.35,d:1,sz:10},rata:{c:'#999',hp:1,sp:.7,d:1,sz:8},bully:{c:'#d44',hp:5,sp:.3,d:2,sz:12},zomb:{c:'#4a6',hp:3,sp:.4,d:1,sz:10},jefe:{c:'#a3f',hp:30,sp:.3,d:2,sz:22}};
/* un mapa por propuesta */
const MP=[
 {n:'Aula Limpia',p:'Diploma al aula más limpia',b:'#9cd',b2:'#8bc',d:'#fff',en:['mugre'],m:{k:'col',n:8,it:'basura'}},
 {n:'Cancha Deportiva',p:'Encuentro deportivo familiar',b:'#6b4',b2:'#5a3',d:'#fff',en:['rata','mugre'],m:{k:'kill',n:15}},
 {n:'Escenario de Talentos',p:'Concurso de talentos y antorchas',b:'#c8a',b2:'#b79',d:'#fd3',en:['rata','bully'],m:{k:'res',n:4}},
 {n:'Pasillo del Buzón',p:'Buzón contra el bullying',b:'#a96',b2:'#985',d:'#642',en:['bully','rata'],m:{k:'boss',n:1}},
 {n:'Enfermería',p:'Botiquín escolar',b:'#eee',b2:'#ddd',d:'#8cf',en:['mugre','bully'],m:{k:'col',n:6,it:'botiquines'}},
 {n:'Patio Chocolatada',p:'Chocolatada navideña',b:'#8bf',b2:'#7ae',d:'#fff',en:['rata','mugre','bully'],m:{k:'sur',n:60}}];

const NC=['#cfa','#aef','#fda','#eee'],LN=['¡VOTA LOS GATITOS!','¡TRABAJAMOS JUNTOS!','¡MARCA LA X!','¡ZONA LIMPIA!'];

/* ---------- PROGRESO ---------- */
const K='gatitos8bit';
const HD=()=>({p:{j:[14,72],a:[88,62],f:[70,66],s:[76,84],w:[92,40],m:[95,22]},z:{j:1,a:1,f:1,s:1,w:1,m:1}});
const FMN=()=>['AUTOMÁTICO','SEMIAUTOMÁTICO (x1.5 monedas)','MANUAL (x2 monedas)'][S.fm];
let S={u:1,lv:1,ch:0,best:0,co:0,nm:'',fm:0,tch:0,hud:HD(),sl:0,rk:[],pk:[0,0,0,0],lo:[0,1,2,3].map(i=>({ch:i,w:[0,1,2],a:[0,0,0],sk:i})),up:[0,1,2,3,4].map(()=>({d:0,s:0,h:0,c:0,r:0}))};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(!S.hud||!S.hud.p||!S.hud.p.a)S.hud=HD();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

/* ---------- DIBUJO ---------- */
const F=(q,x,y,w,h)=>{g.fillStyle=q;g.fillRect(Math.round(x),Math.round(y),w,h)};
function T(s,x,y,al='left'){g.textAlign=al;g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle='#fff';g.fillText(s,x,y)}
function cat(c,x,y,col,a,t){const f=(q,X,Y,w,h)=>{c.fillStyle=q;c.fillRect(Math.round(x+X),Math.round(y+Y),w,h)};
 f(col,5,t>>3&1?1:3,2,5);f(col,-5,-3,10,9);f(col,-5,-6,3,3);f(col,2,-6,3,3);
 f('#fbb',-4,-5,1,2);f('#fbb',3,-5,1,2);f('#111',-3,-1,2,2);f('#111',1,-1,2,2);f('#f66',-1,2,2,1);
 f(col,-4,6,3,1+(t>>3&1));f(col,1,6,3,2-(t>>3&1));
 if(a=='crown'){f('#fd3',-4,-8,8,2);f('#fd3',-4,-9,2,1);f('#fd3',-1,-9,2,1);f('#fd3',2,-9,2,1)}
 else if(a=='bow'){f('#f3a',2,-7,5,3);f('#fff',4,-6,1,1)}
 else if(a=='cap'){f('#222',-5,-8,10,2);f('#222',-3,-9,6,1);f('#fd3',4,-6,1,3)}
 else if(a=='scale'){f('#fd3',-4,3,8,1);f('#fd3',-4,3,1,3);f('#fd3',3,3,1,3)}
 else if(a=='heart'){f('#f33',-3,-8,2,1);f('#f33',1,-8,2,1);f('#f33',-3,-7,6,1);f('#f33',-2,-6,4,1)}}
function item(k,x,y,cc){if(k=='h'){F('#f33',x-3,y-3,6,5);return}if(k=='b'){F('#39f',x-3,y-4,7,8);F('#fff',x-2,y-3,1,6);return}if(k=='a'){F(cc,x-4,y-3,8,6);F('#222',x-1,y-1,2,2);return}const c=IC[k]||IC.basura;F(c[0],x-4,y-4,8,8);F(c[1],x-1,y-3,2,6);F(c[1],x-3,y-1,6,2)}

/* ---------- JUEGO ---------- */
let st=null,mode='menu',LR=null,keys={},joy={x:0,y:0},joyA={x:0,y:0};
const LO=()=>S.lo[S.sl],blk=(x,y,r=0)=>st.ob.some(o=>x>o.x-r&&x<o.x+o.w+r&&y>o.y-r&&y<o.y+o.h+r);
const near=(x,y)=>{let t=null,d=1e9;for(const e of st.es){const q=Math.hypot(e.x-x,e.y-y);if(q<d){d=q;t=e}}return[t,d]};
function rp(){let x,y;do{x=R(20,WW-20);y=R(20,WH-20)}while(Math.hypot(x-WW/2,y-WH/2)<70||blk(x,y,8));return{x,y}}
function rollM(lv){const k=lv%5?PK(['col','kill','res','sur']):'boss';
 return{mi:RI(0,5),m:{k,n:{col:4+(lv>>1),kill:8+lv,res:3+(lv>>2),sur:30+lv*3,boss:1}[k],it:PK(['basura','botiquines','tazas','pelotas'])}}}
function start(mi,m,lv){LR={mi,m,lv};mode='play';ui.className='off';tcShow();
 const l=LO(),c=l.ch,u=S.up[c],ps=PS[c],mx=5+u.h+(ps.hp||0);
 st={mi,m,lv,t:0,prog:0,kl:0,ob:[],ws:0,wt:0,wk:0,wq:11,bw:0,lives:S.pk[2]+1,
  p:{x:WW/2,y:WH/2,hp:mx,mx,ar:3+(ps.ar||0),cd:0,w:0,ch:0,inv:0,sh:0,an:0,iv:0,fa:0,hist:[],tl:0,
   W:l.w.map((id,i)=>{const w=ws(id,l.a[i]);return{...w,am:w.mag,rs:w.mag*3,rt:0,kc:0}})},es:[],bs:[],it:[],cr:[],np:[],tx:[],fx:[],tu:null,tb:null};
 const s=st;if(m.k=='zom')s.prog=1;
 for(let i=0;i<28;i++){const o={x:RI(2,MW-4)*16,y:RI(2,MH-4)*16,w:16*RI(1,3),h:16*RI(1,2)};if(Math.hypot(o.x-WW/2,o.y-WH/2)>80)s.ob.push(o)}
 if(m.k=='col')for(let i=0;i<m.n+2;i++)s.it.push({k:m.it,...rp()});
 if(m.k=='res')for(let i=0;i<m.n;i++)s.np.push({...rp(),r:1,c:PK(NC)});
 for(let i=0;i<3;i++)s.np.push({...rp(),c:PK(NC)});
 for(let i=0;i<5;i++)s.cr.push(rp());
 for(let i=0;i<3;i++){s.it.push({k:'b',...rp()});s.it.push({k:'a',wi:i,...rp()})}
 if(m.k=='boss')spawn('jefe');
 if(!lv&&m.k!='zom')s.tx.push({t:MP[mi].p,l:150});
 s.tx.push({t:mtxt(m),l:200})}
function spawn(t){const p=st.p,E=EN[t],hs=1+(st.lv||0)*.12*(t=='jefe'?1.2:1)+(st.m.k=='zom'?st.prog*.15:0)+st.mi*.04,hp=E.hp*hs;let x,y;
 do{const a=R(0,6.28),d=R(150,200);x=cl(p.x+Math.cos(a)*d,8,WW-8);y=cl(p.y+Math.sin(a)*d,8,WH-8)}while(blk(x,y,8));
 st.es.push({t,x,y,hp,mhp:hp,fr:0,sz:E.sz})}
function hit(e,dm,a){if(e.dead)return;e.hp-=dm;e.x+=Math.cos(a)*2;e.y+=Math.sin(a)*2;snd(220,.04);
 if(e.hp<=0){e.dead=1;const s=st,p=s.p,r=Math.random();s.kl++;if(s.m.k=='zom'&&(!s.bw||e.t=='jefe'))s.wk++;p.W.forEach(w=>{if(w.rb&&++w.kc>=10){w.kc=0;w.rs+=4}});p.ch=Math.min(100,p.ch+12*(1+(PS[LO().ch].ch||0)));
  if(s.m.k=='kill'||(s.m.k=='boss'&&e.t=='jefe'))s.prog++;
  if(r<.1)s.it.push({k:'h',x:e.x,y:e.y});else if(r<.2)s.it.push({k:'b',x:e.x,y:e.y});else if(r<.34)s.it.push({k:'a',wi:RI(0,2),x:e.x,y:e.y})}}
function boom(b){if(b.ex){st.fx.push({x:b.x,y:b.y,r:b.ex,l:10});st.es.forEach(e=>Math.hypot(e.x-b.x,e.y-b.y)<b.ex+e.sz/2&&hit(e,b.dm,0))}}
function fire(w,a){const c=LO().ch,u=S.up[c],pk=S.pk,p=st.p,dm=w.dm*(1+.1*u.d+(PS[c].dm||0)),n=w.n>1?w.n:(pk[1]&&!w.one?2+pk[1]:1),pc=(w.pc||1)+pk[0];snd(300+w.dm*40,.05);
 for(let i=0;i<n;i++){let b=a,ox=0,oy=0;
  if(w.n>1)b=a+(i-(n-1)/2)*w.sp2;else{const o=(i-(n-1)/2)*4;ox=-Math.sin(a)*o;oy=Math.cos(a)*o}
  st.bs.push({x:p.x+ox,y:p.y+oy,vx:Math.cos(b)*w.sp,vy:Math.sin(b)*w.sp,l:w.life||55,dm,pc,ex:w.ex,h:[]})}}
function hurt(d){const s=st,p=s.p;if(p.inv>0||p.sh>0)return;d*=[1,.9,.75,.6][S.pk[3]];p.inv=60;snd(90,.15,'sawtooth');
 if(p.ar>0){const a=Math.min(p.ar,d);p.ar-=a;d-=a}p.hp-=d;
 if(p.hp<=0){if(s.lives>1){s.lives--;p.hp=p.mx;p.inv=180;s.tx.unshift({t:'¡SEGUNDA OPORTUNIDAD!',l:120})}else over(0)}}
function special(){if(mode!='play')return;const s=st,p=s.p,k=LO().sk;
 if(k==4&&s.tb){if(p.tl>0){p.tl=0;s.tx.unshift({t:'Teletransporte cancelado',l:60})}else p.tl=180;return}
 if(p.ch<100)return;snd(300,.4,'sawtooth');
 if(k==4){s.tb={x:p.x,y:p.y,l:2400};return}
 p.ch=0;if(k==0)s.tu={x:p.x,y:p.y,l:600};else if(k==1)p.iv=360;else if(k==2){const h=p.hist[0];if(h){p.x=h.x;p.y=h.y}}else if(k==5)p.W.forEach(w=>{w.am=w.mag;w.rs+=w.mag*2;w.rt=0});else p.sh=300}
function upd(){const s=st,p=s.p,c=LO().ch,u=S.up[c],ps=PS[c],z=s.m.k=='zom',fm=S.fm,sa=Math.hypot(joyA.x,joyA.y)>.25?Math.atan2(joyA.y,joyA.x):null;s.t++;
 let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0)+joy.x,dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0)+joy.y;
 const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}if(l>.1){p.an++;p.fa=Math.atan2(dy,dx)}
 const v=1.1*(1+.05*u.s+(ps.sp||0)),nx=p.x+dx*v,ny=p.y+dy*v;
 if(!blk(nx,p.y,5))p.x=cl(nx,6,WW-6);if(!blk(p.x,ny,5))p.y=cl(ny,6,WH-6);
 p.inv--;p.sh--;p.iv--;p.cd--;if(sa!==null)p.fa=sa;else if(fm&&s.ma)p.fa=s.am;
 if(s.t%30==0){p.hist.push({x:p.x,y:p.y});if(p.hist.length>10)p.hist.shift()}
 if(p.tl>0&&--p.tl==0&&s.tb){p.x=s.tb.x;p.y=s.tb.y;s.tb.l-=960;snd(1200,.2)}
 if(s.tb&&--s.tb.l<=0){s.tb=null;p.ch=0;p.tl=0}
 if(s.tu){if(--s.tu.l<=0)s.tu=null;else if(s.t%10==0){const[e,d]=near(s.tu.x,s.tu.y);if(e&&d<130){const a=Math.atan2(e.y-s.tu.y,e.x-s.tu.x);s.bs.push({x:s.tu.x,y:s.tu.y,vx:Math.cos(a)*2.8,vy:Math.sin(a)*2.8,l:55,dm:1.2,pc:1,ex:20,ms:1,h:[]});snd(520,.05,'sawtooth');snd(240,.14,'triangle')}}}
 if(z){if(s.ws){if(--s.wt<=0){s.ws=0;s.prog++;s.bw=s.prog%5==0?1:0;s.wq=s.bw?1:8+s.prog*3;s.wk=0;if(s.bw){spawn('jefe');s.tx.unshift({t:'¡JEFE!',l:150})}}}
  else if(s.wk>=s.wq){s.ws=1;s.wt=480;s.es=[];p.hp=Math.min(p.mx,p.hp+2);p.W.forEach(w=>w.rs+=Math.ceil(w.mag/2));s.tx.unshift({t:'¡OLEADA SUPERADA!',l:150})}}
 const w=p.W[p.w],[tg,bd]=near(p.x,p.y);
 if(w.rt>0){if(--w.rt<=0){const k=Math.min(w.mag-w.am,w.rs);w.am+=k;w.rs-=k}}
 else if(w.am<=0&&w.rs>0)w.rt=w.rl;
 else if(w.am<=0){const j=p.W.findIndex(x=>x.am>0||x.rs>0);if(j>=0)p.w=j}
 let an=null;const fh=fp!==null||keys.j;
 if(fm==0){if(sa!==null)an=sa;else if(fh)an=s.ma?s.am:p.fa;else if(tg&&bd<w.rg)an=Math.atan2(tg.y-p.y,tg.x-p.x)}
 else if(fm==1){const co=Math.cos(p.fa),si=Math.sin(p.fa);if(s.es.some(e=>{const dx=e.x-p.x,dy=e.y-p.y;return!e.dead&&dx*co+dy*si>0&&Math.hypot(dx,dy)<w.rg&&Math.abs(dy*co-dx*si)<e.sz/2+4}))an=p.fa}
 else if(fh)an=p.fa;
 if(p.cd<=0&&w.am>0&&w.rt<=0&&an!==null&&!s.ws){p.cd=w.cd*(1-.08*u.r);w.am--;p.fa=an;fire(w,an)}
